// Lab: capture separately named jars from a single public Kotlin compilation.
def names = ['device','motion','geolocation','nfc','speech-synthesis','local-auth','photos','search-index','camera']
def spaces = ['device','motion','geolocation','nfc','speechsynthesis','localauth','photos','searchindex','camera']
gradle.settingsEvaluated {
    def p = gradle.startParameter
    if (p.taskNames == [':app:assembleRelease']) p.taskNames = [':app:assembleRelease'] + names.collect { ':app:labJar_' + it.replace('-', '_') }
}
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    def compile = app.tasks.named('compileReleaseKotlin')
    names.eachWithIndex { name, i ->
        app.tasks.register('labJar_' + name.replace('-', '_'), Jar) {
            dependsOn compile
            from(compile.get().destinationDirectory) { include 'exact/' + spaces[i] + '/**' }
            archiveFileName = name + '.jar'
            destinationDirectory = app.file(System.getenv('LAB_CATALOG_OUTPUT'))
            doLast {
                if (zipTree(archiveFile.get().asFile).matching { include '**/*.class' }.isEmpty())
                    throw new GradleException('Empty package jar: ' + name)
                println('LAB_PACKAGE_OK ' + name + ' ' + archiveFile.get().asFile.length())
            }
        }
    }
}
