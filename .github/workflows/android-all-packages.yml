name: Android public first-party catalog
on:
  push:
    branches: [android-all-packages-v1]
permissions: {contents: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
jobs:
  catalog:
    runs-on: blacksmith-16vcpu-ubuntu-2604
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: android, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '8'}
      - name: Compile synthetic public catalog
        run: |
          mkdir -p "$HOME/.gradle/init.d" "$RUNNER_TEMP/catalog"
          cp .github/android-all-package-capture.gradle "$HOME/.gradle/init.d/catalog.gradle"
          python3 .github/android-all-package-prepare.py "$EXACT" "$RUNNER_TEMP/catalog"
          export LAB_CATALOG_INDEX="$RUNNER_TEMP/catalog/index.json" LAB_CATALOG_OUTPUT="$RUNNER_TEMP/catalog" LAB_WRITE_LOCKS=1
          set +e
          bash .github/camera-gradle-fixture.sh seed
          status=$?
          set -e
          echo "LAB_EXACT_WRAPPER_EXIT $status (catalog-only build intentionally does not assemble an APK)"
          python3 .github/android-all-package-validate.py "$RUNNER_TEMP/catalog"
          ls -lh "$RUNNER_TEMP/catalog"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: public-android-catalog
          path: |
            ${{ runner.temp }}/catalog/*.jar
            ${{ runner.temp }}/catalog/*.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: public-android-camera
          path: |
            ${{ runner.temp }}/catalog/camera.jar
            ${{ runner.temp }}/catalog/camera.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: public-android-device
          path: |
            ${{ runner.temp }}/catalog/device.jar
            ${{ runner.temp }}/catalog/device.json
          if-no-files-found: error
          retention-days: 1
  selective:
    needs: catalog
    runs-on: blacksmith-16vcpu-ubuntu-2604
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: android, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '8'}
      - uses: actions/download-artifact@v8.0.2
        with: {name: public-android-camera, path: '${{ runner.temp }}/selected'}
      - uses: actions/download-artifact@v8.0.2
        with: {name: public-android-device, path: '${{ runner.temp }}/selected'}
      - name: Verify and consume selected packages in a distinct synthetic app
        run: |
          export LAB_JAR_DIR="$RUNNER_TEMP/selected" LAB_EXTRA_DEVICE=1
          python3 - "$LAB_JAR_DIR" "$EXACT" <<'PYCODE'
          import hashlib,json,pathlib,sys
          d=pathlib.Path(sys.argv[1]); root=pathlib.Path(sys.argv[2]); names=['camera','device']
          for n in names:
           info=json.loads((d/(n+'.json')).read_text()); assert info['sdk']=='a55c5581c7e1a62cdee1f09367ea2909c74c7292' and hashlib.sha256((d/(n+'.jar')).read_bytes()).hexdigest()==info['sha256']
          p=root/'scripts/agent-android.mjs'; s=p.read_text(); old='bound.flatMap((b) => b.dirs)'; new="bound.flatMap((b) => ['camera', 'device'].includes(b.extension) ? [] : b.dirs)"; assert s.count(old)==1; p.write_text(s.replace(old,new))
          p=root/'host/android/app/build.gradle.kts'; s=p.read_text(); p.write_text(s+'\ndependencies { implementation(files(System.getenv("LAB_JAR_DIR") + "/camera.jar", System.getenv("LAB_JAR_DIR") + "/device.jar")) }\n')
          PYCODE
          bash .github/camera-gradle-fixture.sh fresh
          mapping="$CARGO_TARGET_DIR/android/app/outputs/mapping/release/mapping.txt"
          grep -m1 -E '^exact\.camera\.CameraModule -> ' "$mapping"
          grep -m1 -E '^exact\.device\.DeviceModule -> ' "$mapping"
