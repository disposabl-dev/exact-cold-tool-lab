name: Test iOS camera host reuse
on:
  push:
    branches: [ios-selective-composition-v1]
permissions: {contents: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
  EXACT_UPDATE_TRUST: production
  EXACT_UPDATE_GENESIS: '1'
  EXACT_BUILD_NUMBER: '1'
jobs:
  producer:
    runs-on: blacksmith-12vcpu-macos-27
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - &setup
        uses: ./.github/actions/exact-setup
        with:
          platform: ios
          exact-ref: ${{ env.EXACT_REF }}
          bundle-version: '8'
      - run: bash .github/camera-object-test.sh producer
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: public-camera-objects
          path: ${{ runner.temp }}/camera-kit.tar
          retention-days: 1
  consumer:
    needs: producer
    runs-on: blacksmith-12vcpu-macos-27
    steps:
      - *checkout
      - *setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: public-camera-objects
          path: ${{ runner.temp }}
      - run: bash .github/camera-object-test.sh consumer
