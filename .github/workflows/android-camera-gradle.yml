name: Compare Android camera Gradle overlay
on:
  push:
    branches: [android-feature-gradle-v9]
permissions: {contents: read, actions: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
jobs:
  fresh:
    strategy:
      fail-fast: false
      matrix: {overlay: ['baseline', 'camera'], iteration: [1, 2]}
    runs-on: blacksmith-16vcpu-ubuntu-2604
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: android, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '9'}
      - uses: actions/download-artifact@v8.0.2
        if: matrix.overlay == 'camera'
        with: {name: camera-produced, path: '${{ runner.temp }}/camera-cache', run-id: '45023530033', github-token: '${{ github.token }}'}
      - name: Verify and restore public camera overlay
        if: matrix.overlay == 'camera'
        env: {OVERLAY_SHA: '639c319ce36fb191e4ccc4a56838fc9fcae1893acfac9b3a746252259302fe71'}
        run: |
          echo "$OVERLAY_SHA  $RUNNER_TEMP/camera-cache/cargo-gradle-camera.zst" | sha256sum -c -
          python3 .github/actions/exact-setup/scripts/android-camera-restore.py "$RUNNER_TEMP/camera-cache/cargo-gradle-camera.zst" "$HOME/.gradle"
      - name: Build distinct signed camera APK
        run: LAB_APERTURE=1 bash .github/camera-gradle-fixture.sh fresh
