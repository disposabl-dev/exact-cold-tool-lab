name: Compare Android camera Gradle overlay
on:
  push:
    branches: [android-feature-gradle-v9]
permissions: {contents: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
jobs:
  seed:
    runs-on: blacksmith-16vcpu-ubuntu-2604
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: android, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '9'}
      - name: Snapshot existing public inputs
        run: |
          cd "$HOME/.gradle"
          find caches -type f -print | LC_ALL=C sort > "$RUNNER_TEMP/before.txt"
      - name: Build synthetic camera seed
        run: bash .github/camera-gradle-fixture.sh seed
      - name: Vet and package only new public inputs
        run: |
          python3 .github/camera-gradle-vet.py "$RUNNER_TEMP/vetted"
          python3 - "$RUNNER_TEMP/vetted" "$RUNNER_TEMP/before.txt" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); old=set(pathlib.Path(sys.argv[2]).read_text().splitlines())
          for p in root.rglob('*'):
              if p.is_file() and p.relative_to(root).as_posix() in old: p.unlink()
          PY
          tar -cf - -C "$RUNNER_TEMP/vetted" caches | zstd -T0 -3 -o "$RUNNER_TEMP/camera-overlay.zst"
          sha256sum "$RUNNER_TEMP/camera-overlay.zst" | tee "$RUNNER_TEMP/overlay.sha256"
          ls -lh "$RUNNER_TEMP/camera-overlay.zst"
      - uses: actions/upload-artifact@v7.0.2
        with: {name: camera-overlay, path: '${{ runner.temp }}/camera-overlay.zst', compression-level: 0, retention-days: 1}
      - id: digest
        run: echo "sha=$(sha256sum "$RUNNER_TEMP/camera-overlay.zst" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    outputs: {sha: '${{ steps.digest.outputs.sha }}'}
  fresh:
    needs: seed
    strategy:
      fail-fast: false
      matrix: {overlay: ['baseline', 'camera']}
    runs-on: blacksmith-16vcpu-ubuntu-2604
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: android, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '9'}
      - uses: actions/download-artifact@v8.0.2
        if: matrix.overlay == 'camera'
        with: {name: camera-overlay, path: '${{ runner.temp }}/camera-cache'}
      - name: Verify and restore public camera overlay
        if: matrix.overlay == 'camera'
        env: {OVERLAY_SHA: '${{ needs.seed.outputs.sha }}'}
        run: |
          echo "$OVERLAY_SHA  $RUNNER_TEMP/camera-cache/camera-overlay.zst" | sha256sum -c -
          zstd -dc "$RUNNER_TEMP/camera-cache/camera-overlay.zst" | tar -xkf - -C "$HOME/.gradle"
      - name: Build distinct signed camera APK
        run: bash .github/camera-gradle-fixture.sh fresh
