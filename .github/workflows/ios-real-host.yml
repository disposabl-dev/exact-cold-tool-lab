name: Capture media iOS SDK host cohorts
on:
  push:
    branches: [ios-media-host-cohorts-v1]
permissions: {contents: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
  EXACT_UPDATE_TRUST: production
  EXACT_UPDATE_GENESIS: '1'
  EXACT_BUILD_NUMBER: '1'
jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aperture
            repo: disposabl-dev/exact-cold-aperture-log
            commit: aa4a88aeb7e6c25519a8a2f065456d636df157b6
          - name: voice
            repo: disposabl-dev/exact-cold-voice-notes
            commit: d18136998c5cc7ae74f56e98f8a64129a4573169
    runs-on: blacksmith-6vcpu-macos-27
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: actions/checkout@v7.0.1
        with: {repository: '${{ matrix.repo }}', ref: '${{ matrix.commit }}', path: sample, persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: ios, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '8'}
      - name: Build actual source graph with public test identity
        shell: bash
        run: |
          rsync -a --delete --exclude=.exact --exclude=node_modules --exclude=target "$GITHUB_WORKSPACE/sample/apps/apps/" "$NATIVE_APP_DIR/"
          cd "$NATIVE_APP_DIR"
          bun install --frozen-lockfile
          bun -e 'const p="app.ts",s=await Bun.file(p).text(); await Bun.write(p,s.replace(/export const appId = [^;]+;/, "export const appId = \"dev.disposabl.synthetic\";"))'
          unset EXACT_LINK_KIT_PROOF EXACT_LINK_KIT
          export CONVEX_ORIGIN=wss://public-seed.invalid PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= EXACT_VERSION=0.1.0 EXACT_BAKE_OUTPUT="$RUNNER_TEMP/ios-artifacts/bake"
          bun -e 'const p="app.json",a=await Bun.file(p).json(); a.id=a.app.id="dev.disposabl.synthetic"; a.deploy.store.ios="A"; a.deploy.signing={key:"mobile",keys:{mobile:process.env.PUBLIC_KEY}}; a.deploy.channel="base-1"; a.deploy.channels={"base-1":"appdrop"}; await Bun.write(p,JSON.stringify(a,null,2)+"\n")'
          bash "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/native-build.sh" ios
          python3 - <<'PY_ASSERT'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'ios-artifacts/apps.receipt.json').read_text()); print('REAL_SAMPLE_GRAPH',r['app']['id'],r['build']['compat']['inputs']['linked'],r['build']['graph']['extensions'])
          PY_ASSERT
      - name: Collect public SDK host objects
        shell: bash
        run: |
          product="$CARGO_TARGET_DIR/apple-swift/ios-17.0-balanced/out/Products/Release-iphoneos"
          mkdir -p "$RUNNER_TEMP/host-objects"
          for file in "$product"/Exact*.o; do
            name=$(basename "$file")
            case "$name" in ExactComposition.o|ExactLaunchParts.o) continue;; esac
            cp "$file" "$RUNNER_TEMP/host-objects/$name"
          done
          for dir in "$product"/Exact*.swiftmodule; do
            name=$(basename "$dir")
            case "$name" in ExactComposition.swiftmodule|ExactIOS.swiftmodule|ExactLaunchParts.swiftmodule) continue;; esac
            cp -R "$dir" "$RUNNER_TEMP/host-objects/$name"
          done
          export COHORT_NAME="${{ matrix.name }}" SAMPLE_COMMIT="${{ matrix.commit }}"
          python3 - <<'PY_MANIFEST'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']); folder=root/'host-objects'
          receipt=json.loads((root/'ios-artifacts/apps.receipt.json').read_text())['build']
          files={str(p.relative_to(folder)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(folder.rglob('*')) if p.is_file() and not p.is_symlink()}
          assert files and not any(x.startswith(('ExactComposition.', 'ExactLaunchParts.', 'ExactIOS.')) for x in files)
          manifest={'schema':1,'cohort':os.environ['COHORT_NAME'],'sample_commit':os.environ['SAMPLE_COMMIT'],'exact_ref':os.environ['EXACT_REF'],'target':'arm64-apple-ios','minimum_ios':'17.0','profile':'balanced','sdk':subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-version'],text=True).strip(),'xcode':subprocess.check_output(['xcodebuild','-version'],text=True).strip(),'swift':subprocess.check_output(['swift','--version'],text=True).strip(),'linked':receipt['compat']['inputs']['linked'],'extensions':receipt['graph']['extensions'],'files':files}
          (folder/'manifest.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          print('COHORT_MANIFEST',json.dumps({k:v for k,v in manifest.items() if k!='files'},sort_keys=True))
          print('MANIFEST_SHA256',hashlib.sha256((folder/'manifest.json').read_bytes()).hexdigest(),'FILES',len(files))
          PY_MANIFEST
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/host-objects.tar" host-objects
      - uses: actions/upload-artifact@v7.0.2
        with: {name: 'ios-host-${{ matrix.name }}', path: '${{ runner.temp }}/host-objects.tar', retention-days: 1, compression-level: 0}
