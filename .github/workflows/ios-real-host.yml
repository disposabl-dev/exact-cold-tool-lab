name: Compare real iOS host cohorts
on:
  push:
    branches: [ios-general-hardened-v1]
permissions: {contents: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
  EXACT_UPDATE_TRUST: production
  EXACT_UPDATE_GENESIS: '1'
  EXACT_BUILD_NUMBER: '1'
jobs:
  sample:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: paperstack
            repo: disposabl-dev/exact-cold-paperstack
            commit: 0871045e29989ccedea3a3227e499053a201e89e
          - name: trail
            repo: disposabl-dev/exact-cold-trail-coach
            commit: b081d589b2e23f1b16281f32a52fc260e55fea92
    runs-on: blacksmith-12vcpu-macos-27
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: actions/checkout@v7.0.1
        with: {repository: '${{ matrix.repo }}', ref: '${{ matrix.commit }}', path: sample, persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: ios, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '8'}
      - uses: actions/download-artifact@v8.0.2
        with: {name: ios-host-paperstack, path: '${{ runner.temp }}/catalog-paper', repository: '${{ github.repository }}', run-id: '45022542360', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v8.0.2
        with: {name: ios-host-trail, path: '${{ runner.temp }}/catalog-trail', repository: '${{ github.repository }}', run-id: '45022542360', github-token: '${{ github.token }}'}
      - name: Verify and unpack pinned first-party catalog
        shell: bash
        run: |
          [[ $(shasum -a 256 "$RUNNER_TEMP/catalog-paper/host-objects.tar" | cut -d ' ' -f1) == e87fdc4244368e956ea03eddce6a05c0adf16153917274a7680bf897a75b767b ]]
          [[ $(shasum -a 256 "$RUNNER_TEMP/catalog-trail/host-objects.tar" | cut -d ' ' -f1) == 769a63ccfe84edee82aee1690570499eda548364061775fb1b25917a2892b74a ]]
          mkdir -p "$RUNNER_TEMP/catalog/paper" "$RUNNER_TEMP/catalog/trail"
          tar -xf "$RUNNER_TEMP/catalog-paper/host-objects.tar" -C "$RUNNER_TEMP/catalog/paper"
          tar -xf "$RUNNER_TEMP/catalog-trail/host-objects.tar" -C "$RUNNER_TEMP/catalog/trail"
          python3 "$GITHUB_WORKSPACE/.github/make-host-test-catalog.py" "$RUNNER_TEMP/catalog" "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts"
      - name: Selectively link fresh real app archive
        shell: bash
        run: |
          rsync -a --delete --exclude=.exact --exclude=node_modules --exclude=target "$GITHUB_WORKSPACE/sample/apps/apps/" "$NATIVE_APP_DIR/"
          cd "$NATIVE_APP_DIR"
          bun install --frozen-lockfile
          export EXACT_LINK_KIT_PROOF="$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/ios-general-link.py"
          export EXACT_HOST_CATALOG="$RUNNER_TEMP/catalog/union" EXACT_GENERAL_PROOF="$RUNNER_TEMP/general-proof.json"
          export CONVEX_ORIGIN=wss://public-seed.invalid PUBLIC_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= EXACT_VERSION=0.1.0 EXACT_BAKE_OUTPUT="$RUNNER_TEMP/ios-artifacts/bake"
          bun -e 'const p="app.json",a=await Bun.file(p).json(); a.deploy.store.ios="A"; a.deploy.signing={key:"mobile",keys:{mobile:process.env.PUBLIC_KEY}}; a.deploy.channel="base-1"; a.deploy.channels={"base-1":"appdrop"}; await Bun.write(p,JSON.stringify(a,null,2)+"\n")'
          bash "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/native-build.sh" ios 2>&1 | tee "$RUNNER_TEMP/general-build.log"
          test -s "$EXACT_GENERAL_PROOF"
          cat "$EXACT_GENERAL_PROOF"
          grep -F 'new production executable linked from verified inputs' "$RUNNER_TEMP/general-build.log"
