name: Measure public delivery
on:
  push:
    branches: [public-delivery-staged-228]
permissions:
  contents: read
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
  EXACT_UPDATE_TRUST: production
  EXACT_UPDATE_GENESIS: 1
  EXACT_MOBILE_CHANNEL: base-1
  CONVEX_ORIGIN: wss://first-install-probe.invalid
  EXACT_BUILD_NUMBER: 1
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: android, variant: parallel, runner: blacksmith-8vcpu-ubuntu-2604}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with:
          platform: ${{ matrix.platform }}
          exact-ref: ${{ env.EXACT_REF }}
          bundle-version: '7'
      - name: Load pinned AppDrop and instrument the publisher
        env:
          MODE: ${{ matrix.variant }}
        run: |
          mkdir -p "$RUNNER_TEMP/drop"
          cd "$RUNNER_TEMP/drop"
          npm pack --silent appdrop@0.8.0
          tar -xzf appdrop-0.8.0.tgz
          python3 "$GITHUB_WORKSPACE/.github/profile-publisher.py"
      - name: Build installer
        shell: bash
        working-directory: ${{ env.NATIVE_APP_DIR }}
        run: |
          export EXACT_UPDATE_SEED=$(openssl rand -base64 32)
          export EXACT_BAKE_OUTPUT="$RUNNER_TEMP/${{ matrix.platform }}-artifacts/bake"
          if [[ '${{ matrix.platform }}' == android ]]; then
            pw=$(openssl rand -hex 16)
            export PROBE_PASS=$pw
            keytool -genkeypair -alias android -keystore "$RUNNER_TEMP/probe.p12" -storetype pkcs12 -storepass:env PROBE_PASS -keypass:env PROBE_PASS -dname 'CN=Isolated runner test' -keyalg RSA -keysize 2048 -validity 1000 >/dev/null 2>&1
            export ANDROID_APK_SIGNING=$(jq -nc --arg pw "$pw" --arg ks "$(base64 -w0 "$RUNNER_TEMP/probe.p12")" '{password:$pw,keystore:$ks}')
          fi
          bun "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/mobile-updates.mjs" configure '${{ matrix.platform }}'
          export EXACT_VERSION=0.1.0
          export DELIVERY_GATE=$(mktemp -d "$RUNNER_TEMP/stage.XXXXXX")
          cli="$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts"
          stamp() { date +%s%3N; }
          bash "$cli/native-build.sh" android & builder=$!
          trap 'if [[ -n "${seed:-}" ]]; then kill "$seed" 2>/dev/null || true; fi' EXIT
          while [[ ! -f "$DELIVERY_GATE/baked" ]]; do kill -0 "$builder"; sleep .1; done
          echo "ALL_BAKES_READY $(stamp)"
          bun --preload "$GITHUB_WORKSPACE/.github/trace-fetch.mjs" "$cli/mobile-updates.mjs" seed android & seed=$!
          wait "$builder"
          echo "SIGNED_INSTALLER_VERIFIED $(stamp)"
          file="$RUNNER_TEMP/android-artifacts/android-production.apk"
          bun --preload "$GITHUB_WORKSPACE/.github/trace-fetch.mjs" "$RUNNER_TEMP/drop/package/cli.mjs" "$file" --json > "$RUNNER_TEMP/drop-out"
          python3 -c 'import json,sys,re; s=open(sys.argv[1]).read(); j=json.loads(s[s.index("{"):]); assert re.fullmatch("https://(www[.])?appdrop[.]app/d/[A-Za-z0-9]+/?",j["url"]); assert j["size"]==int(sys.argv[2]);print("APK_BYTES",j["size"])' "$RUNNER_TEMP/drop-out" "$(stat -c%s "$file")"
          echo "APPDROP_UPLOAD_ACCEPTED $(stamp)"
          touch "$DELIVERY_GATE/installer-verified"
          wait "$seed"
          trap - EXIT
          echo "LINK_AND_OTA_READY $(stamp)"
          grep '^HTTP ' "$RUNNER_TEMP/drop-out"
