name: Verify CameraX release locks on Linux
on:
  push:
    branches: [camera-linux-locks]
permissions: {contents: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
  EXACT_UPDATE_GENESIS: 1
  EXACT_UPDATE_TRUST: production
  EXACT_MOBILE_CHANNEL: base-1
  EXACT_BUILD_NUMBER: 1
  CONVEX_ORIGIN: wss://camera-lock-fixture.invalid
jobs:
  locks:
    runs-on: blacksmith-16vcpu-ubuntu-2604
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with:
          platform: android
          exact-ref: ${{ env.EXACT_REF }}
          bundle-version: '8'
      - name: Generate Android release locks from declared camera dependencies
        working-directory: ${{ env.NATIVE_APP_DIR }}
        run: |
          export EXACT_UPDATE_SEED=$(openssl rand -base64 32)
          export EXACT_BAKE_OUTPUT="$RUNNER_TEMP/camera-bake"
          bun "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/mobile-updates.mjs" configure android
          export EXACT_VERSION=0.1.0 EXACT_KEYSTORE="$RUNNER_TEMP/fixture.p12" EXACT_KEY_ALIAS=android
          export EXACT_KEYSTORE_PASSWORD=$(openssl rand -hex 24)
          export EXACT_KEY_PASSWORD="$EXACT_KEYSTORE_PASSWORD"
          keytool -genkeypair -noprompt -storetype pkcs12 -keystore "$EXACT_KEYSTORE" -storepass:env EXACT_KEYSTORE_PASSWORD -keypass:env EXACT_KEY_PASSWORD -alias android -keyalg RSA -dname CN=CameraLockFixture -validity 3
          bun exact.mjs android --release --write-locks --no-install
          test -s gradle.lockfile && test -s gradle-verification.xml
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reviewed-camera-locks
          path: |
            ${{ env.NATIVE_APP_DIR }}/gradle.lockfile
            ${{ env.NATIVE_APP_DIR }}/gradle-verification.xml
          if-no-files-found: error
          retention-days: 1
