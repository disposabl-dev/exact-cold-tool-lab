name: Time public cache transfer
on:
  push:
    branches: [release-range-test]
permissions:
  contents: read
jobs:
  transfer:
    strategy:
      matrix:
        runner: [blacksmith-8vcpu-ubuntu-2604, blacksmith-6vcpu-macos-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify fresh large release download
        run: |
          cd "$RUNNER_TEMP"
          echo '{"cargo-android.zst":{"sha256":"56607e509015fd9f009d0135ff3f56d490abab2644669105bd23b8a2c9467de2","size":614235234}}' > manifest.json
          time python3 "$GITHUB_WORKSPACE/.github/fetch-input.py" "https://github.com/$GITHUB_REPOSITORY/releases/download/compiled-inputs-v2" manifest.json cargo-android.zst cargo-android.zst
