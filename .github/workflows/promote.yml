name: Prepare public Android compiler image
on:
  push:
    branches: [android-cache-image]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: blacksmith-8vcpu-ubuntu-2604
    steps:
      - name: Package public compiler dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
          IMAGE: ghcr.io/disposabl-dev/exact-cold-tool-lab/android-compiler
        run: |
          set -euo pipefail
          mkdir -p /tmp/layers/{cargo,gradle,home}
          restore() (
            base=$1 archive=$2 target=$3
            cd /tmp
            curl -fsSL --retry 3 "$base/$archive.sha256" -o "$archive.sha256"
            curl -fsSL --retry 3 "$base/$archive" -o "$archive"
            sha256sum -c "$archive.sha256"
            zstd -dc "$archive" | tar -xf - -C "$target"
          )
          source="https://github.com/$GITHUB_REPOSITORY/releases/download/compiled-inputs-v2"
          setup="https://github.com/disposabl-dev/disposabl-exact/releases/download/v4-exact-$REF-bun-1.4.5"
          restore "$source" cargo-android.zst /tmp/layers/cargo & a=$!
          restore "$source" cargo-gradle.zst /tmp/layers/gradle & b=$!
          restore "$setup" "exact-$REF-android-Linux-X64-bun-1.4.5.tar.zst" /tmp/layers/home & c=$!
          wait "$a"; wait "$b"; wait "$c"
          cd /tmp/layers
          cat >Dockerfile <<'DOCKER'
          FROM busybox:1.37.0
          LABEL org.opencontainers.image.source="https://github.com/disposabl-dev/exact-cold-tool-lab"
          COPY --chown=1001:1001 cargo/ /seed/cargo/
          COPY --chown=1001:1001 gradle/ /seed/gradle/
          COPY --chown=1001:1001 home/ /seed/home/
          DOCKER
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:v2" .
          docker push "$IMAGE:v2"
          docker pull "$IMAGE:v2"
          docker inspect "$IMAGE:v2" --format '{{index .RepoDigests 0}}' >> "$GITHUB_STEP_SUMMARY"
