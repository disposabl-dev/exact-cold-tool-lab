name: Android isolated package graph trial
on:
  push:
    branches: [android-isolated-graph-v1]
permissions: {contents: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
jobs:
  catalog:
    runs-on: blacksmith-16vcpu-ubuntu-2604
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: android, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '8'}
      - name: Compile independent package graphs
        run: |
          python3 .github/actions/exact-setup/scripts/android-package-catalog.py fingerprint "$RUNNER_TEMP/isograph-host.json"
          python3 .github/actions/exact-setup/scripts/android-package-producer.py "$EXACT" "$RUNNER_TEMP/isograph"
          cd "$EXACT/host/android"
          mapfile -t tasks < <(jq -r '.[] | select(.implementation.class != null) | ":catalog_" + (.name | gsub("-"; "_")) + ":catalogJar"' "$RUNNER_TEMP/isograph/packages.json")
          ./gradlew --no-daemon --no-watch-fs --continue --max-workers=4 --write-verification-metadata sha256 \
            --project-cache-dir "$RUNNER_TEMP/isograph-state" "${tasks[@]}"
          python3 "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/android-package-catalog.py" seal "$RUNNER_TEMP/isograph" "$RUNNER_TEMP/isograph-host.json" "$RUNNER_TEMP/isograph/sealed"
          mkdir -p "$RUNNER_TEMP/release"
          for name in camera device; do
            cp "$RUNNER_TEMP/isograph/jars/$name.jar" "$RUNNER_TEMP/isograph/sealed/$name.jar"
            tar -cf - -C "$RUNNER_TEMP/isograph/sealed" "$name.json" "$name.jar" | zstd -q -o "$RUNNER_TEMP/release/android-package-$name.zst"
          done
          python3 - "$RUNNER_TEMP/release" <<'PYCODE'
          import json,pathlib,hashlib,sys
          d=pathlib.Path(sys.argv[1]);(d/'inputs.json').write_text(json.dumps({p.name:{'size':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in d.glob('*.zst')}))
          PYCODE
          ls -lh "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: isograph-package-trial
          path: ${{ runner.temp }}/release/*
          if-no-files-found: warn
          retention-days: 1

  consume:
    needs: catalog
    runs-on: blacksmith-16vcpu-ubuntu-2604
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: android, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '8'}
      - uses: actions/download-artifact@v8.0.2
        with: {name: isograph-package-trial, path: '${{ runner.temp }}/release'}
      - name: Test guarded package selection
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp .github/actions/exact-setup/scripts/android-package-consume.init.gradle "$HOME/.gradle/init.d/catalog-consume.gradle"
          export EXACT_ANDROID_CATALOG_PACKAGES=camera,device LAB_EXTRA_DEVICE=1
          export EXACT_ANDROID_CATALOG_RELEASE="file://$RUNNER_TEMP/release"
          export EXACT_ANDROID_CATALOG_MANIFEST="$RUNNER_TEMP/release/inputs.json"
          export EXACT_ANDROID_CATALOG_SCRIPTS="$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts"
          export EXACT_ANDROID_CATALOG_WORK="$RUNNER_TEMP/catalog-work"
          bash .github/camera-gradle-fixture.sh fresh
          mapping="$CARGO_TARGET_DIR/android/app/outputs/mapping/release/mapping.txt"
          grep -m1 -E '^exact\.camera\.CameraModule -> ' "$mapping"
          grep -m1 -E '^exact\.device\.DeviceModule -> ' "$mapping"
