name: Android isolated package graph trial
on:
  push:
    branches: [android-isolated-graph-v1]
permissions: {contents: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
jobs:
  catalog:
    runs-on: blacksmith-16vcpu-ubuntu-2604
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: android, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '8'}
      - name: Compile independent package graphs
        run: |
          python3 .github/actions/exact-setup/scripts/android-package-producer.py "$EXACT" "$RUNNER_TEMP/isograph" camera device background-transfer
          cd "$EXACT/host/android"
          ./gradlew --no-daemon --no-watch-fs --continue --write-verification-metadata sha256 \
            --project-cache-dir "$RUNNER_TEMP/isograph-state" \
            :catalog_camera:catalogJar :catalog_device:catalogJar :catalog_background_transfer:catalogJar
          ls -lh "$RUNNER_TEMP/isograph/jars"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: isograph-package-trial
          path: ${{ runner.temp }}/isograph/jars/*
          if-no-files-found: warn
          retention-days: 1
