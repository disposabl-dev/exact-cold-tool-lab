name: Android isolated package graph trial
on:
  push:
    branches: [android-isolated-graph-v1]
permissions: {contents: read, actions: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
jobs:
  consume:
    runs-on: blacksmith-16vcpu-ubuntu-2604
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: android, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '8'}
      - uses: actions/download-artifact@v8.0.2
        with: {name: isograph-package-trial, path: '${{ runner.temp }}/release', run-id: '45021877181', github-token: '${{ github.token }}'}
      - name: Test guarded package selection
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp .github/actions/exact-setup/scripts/android-package-consume.init.gradle "$HOME/.gradle/init.d/catalog-consume.gradle"
          export EXACT_ANDROID_CATALOG_PACKAGES=camera,device LAB_EXTRA_DEVICE=1
          export EXACT_ANDROID_CATALOG_RELEASE="file://$RUNNER_TEMP/release"
          export EXACT_ANDROID_CATALOG_MANIFEST="$RUNNER_TEMP/release/inputs.json"
          export EXACT_ANDROID_CATALOG_SCRIPTS="$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts"
          export EXACT_ANDROID_CATALOG_WORK="$RUNNER_TEMP/catalog-work"
          bash .github/camera-gradle-fixture.sh fresh
          mapping="$CARGO_TARGET_DIR/android/app/outputs/mapping/release/mapping.txt"
          grep -m1 -E '^exact\.camera\.CameraModule -> ' "$mapping"
          grep -m1 -E '^exact\.device\.DeviceModule -> ' "$mapping"
