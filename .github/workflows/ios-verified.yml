name: Verify iOS public compiler kit
on:
  push:
    branches: [ios-verified-arms]
permissions:
  contents: write
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
  EXACT_UPDATE_TRUST: production
  EXACT_UPDATE_GENESIS: '1'
  EXACT_BUILD_NUMBER: '1'
  CARGO_PROFILE_RELEASE_LTO: 'off'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_PROFILE_BALANCED_LTO: 'off'
  CARGO_PROFILE_SIZE_LTO: 'off'
jobs:
  producer:
    runs-on: blacksmith-6vcpu-macos-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with:
          platform: ios
          exact-ref: ${{ env.EXACT_REF }}
          bundle-version: '3'
      - name: Build synthetic public seed
        run: bash .github/ios-kit-fixture.sh
      - name: Check and publish test assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: disposabl-dev/exact-cold-tool-lab
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kit-out"
          for file in *; do shasum -a 256 "$file" > "$file.sha256"; done
          for file in *.sha256; do shasum -a 256 -c "$file"; done
          gh release create ios-arms-v1 --target "$GITHUB_SHA" --title 'iOS arm-cache test inputs' --notes 'Public synthetic fixture; experimental lab only.' ./*
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ios-verified-producer-evidence
          path: |
            ${{ runner.temp }}/kit-out/*.json
            ${{ runner.temp }}/public-seed.json
          retention-days: 1
