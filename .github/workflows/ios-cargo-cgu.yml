name: iOS Rust app profile experiment
on:
  push:
    branches: [ios-cargo-cgu-v1]
permissions: {contents: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
jobs:
  compare:
    runs-on: blacksmith-6vcpu-macos-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: ios, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '9'}
      - name: Compare production native app compiles
        shell: bash
        run: |
          set -euo pipefail
          export IOS_REAL_CARGO="$(command -v cargo)"
          mkdir -p "$RUNNER_TEMP/cargowrap"
          cp .github/ios-cgu-wrapper.sh "$RUNNER_TEMP/cargowrap/cargo"
          chmod +x "$RUNNER_TEMP/cargowrap/cargo"
          export PATH="$RUNNER_TEMP/cargowrap:$PATH"
          cd "$NATIVE_APP_DIR"
          for variant in baseline cgu16; do
            export EXACT_UPDATE_TRUST=production EXACT_UPDATE_GENESIS=1 EXACT_BUILD_NUMBER=1 EXACT_VERSION=0.1.0 EXACT_MOBILE_CHANNEL=base-1
            export EXACT_BAKE_OUTPUT="$RUNNER_TEMP/bake-$variant" CONVEX_ORIGIN="wss://$variant-rust-fixture.invalid"
            export EXACT_UPDATE_SEED="$(openssl rand -base64 32)"
            python3 - "$variant" <<'PY'
          import json,sys
          p='app.json'; x=json.load(open(p)); x['id']='dev.example.ioscgu'+sys.argv[1]; x['app']['id']=x['id']; open(p,'w').write(json.dumps(x,indent=2)+'\n')
          PY
            bun "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/mobile-updates.mjs" configure ios
            unset EXACT_UPDATE_SEED
            if [[ $variant == cgu16 ]]; then export IOS_TEST_CGU=16; else unset IOS_TEST_CGU; fi
            start=$(date +%s)
            bun exact.mjs ios --device --release --unsigned --archive "$RUNNER_TEMP/$variant.ipa" --json > "$RUNNER_TEMP/$variant.json"
            echo "$variant elapsed $(( $(date +%s) - start )) seconds"
            jq -e --arg id "dev.example.ioscgu$variant" '.trust=="production" and .compat.inputs.platform=="ios" and .compat.inputs.app==$id' "$EXACT_BAKE_OUTPUT/ios-aarch64-apple-ios.build.json" >/dev/null
            unzip -tq "$RUNNER_TEMP/$variant.ipa" >/dev/null
          done
