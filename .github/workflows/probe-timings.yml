name: Measure repeated iPhone toolchain probes
on:
  push:
    branches: [camera-host-probes-v1]
permissions: {contents: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
  EXACT_UPDATE_TRUST: production
  EXACT_UPDATE_GENESIS: '1'
  EXACT_BUILD_NUMBER: '1'
  EXACT_VERSION: 0.1.0
jobs:
  iphone:
    runs-on: blacksmith-12vcpu-macos-27
    strategy:
      fail-fast: false
      matrix: {mode: [record, reuse]}
    env:
      PROFILE_MODE: ${{ matrix.mode }}
      CONVEX_ORIGIN: wss://camera-profile.invalid
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - run: |
          mkdir "$RUNNER_TEMP/host-probes"
          for t in swift xcodebuild xcrun; do ln -s "$PWD/.github/ios-probe.sh" "$RUNNER_TEMP/host-probes/$t"; done
          echo "$RUNNER_TEMP/host-probes" >> "$GITHUB_PATH"
      - uses: ./.github/actions/exact-setup
        with: {platform: ios, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '8'}
      - name: Build and verify an independent production camera archive
        shell: bash
        run: |
          cd "$NATIVE_APP_DIR"
          export EXACT_BAKE_OUTPUT="$RUNNER_TEMP/ios-artifacts/bake" EXACT_MOBILE_CHANNEL=base-1
          export EXACT_UPDATE_SEED="$(openssl rand -base64 32)"
          bun "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/mobile-updates.mjs" configure ios
          unset EXACT_UPDATE_SEED
          bash "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/native-build.sh" ios
      - name: List host query timings
        if: always()
        run: cat "$RUNNER_TEMP/host-query/calls"
