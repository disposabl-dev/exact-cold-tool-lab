name: Reuse individual optimized Rust units across fresh app identities
on: {push: {branches: [android-rust-units-v1]}}
permissions: {contents: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
jobs:
  seed:
    runs-on: blacksmith-16vcpu-ubuntu-2604
    steps:
      - &checkout
        uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - &setup
        uses: ./.github/actions/exact-setup
        with: {platform: android, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '8'}
      - &configure
        name: Enable incremental compilation for the generated Android crate only
        run: |
          cat >> "$HOME/.cargo/config.toml" <<'CONFIG'
          [profile.release.package.apps-android]
          incremental = true
          CONFIG
      - run: bash .github/camera-gradle-fixture.sh seed
      - name: Collect optimized units from the public fixture
        run: |
          cd "$CARGO_TARGET_DIR/aarch64-linux-android/release/incremental"
          dirs=(apps_android-*)
          [[ ${#dirs[@]} == 1 && -d ${dirs[0]} ]]
          find "${dirs[@]}" -type f -name '*.o' | wc -l
          tar --exclude='*.lock' -cf - "${dirs[@]}" | zstd -T0 -3 -o "$RUNNER_TEMP/units.zst"
          ls -lh "$RUNNER_TEMP/units.zst"
      - uses: actions/upload-artifact@v7.0.2
        with: {name: public-rust-units, path: '${{ runner.temp }}/units.zst', retention-days: 1, compression-level: 0}
  fresh:
    needs: seed
    strategy:
      matrix:
        mode: [standard, reuse]
    runs-on: blacksmith-16vcpu-ubuntu-2604
    steps:
      - *checkout
      - *setup
      - name: Enable incremental mode only for the reuse trial
        if: matrix.mode == 'reuse'
        run: |
          cat >> "$HOME/.cargo/config.toml" <<'CONFIG'
          [profile.release.package.apps-android]
          incremental = true
          CONFIG
      - uses: actions/download-artifact@v8.0.2
        if: matrix.mode == 'reuse'
        with: {name: public-rust-units, path: '${{ runner.temp }}'}
      - name: Restore only app-independent compiler work candidates
        if: matrix.mode == 'reuse'
        run: |
          dest="$CARGO_TARGET_DIR/aarch64-linux-android/release/incremental"
          mkdir -p "$dest"
          zstd -dc "$RUNNER_TEMP/units.zst" | tar -xf - -C "$dest"
      - name: Build distinct signed app and verify fresh receipt
        run: bash .github/camera-gradle-fixture.sh fresh
