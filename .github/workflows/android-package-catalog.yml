name: Android independent package catalog trial
on:
  push:
    branches: [android-package-catalog-v1]
permissions: {contents: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
jobs:
  catalog:
    runs-on: blacksmith-16vcpu-ubuntu-2604
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: android, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '8'}
      - name: Compile independent public package jars
        run: |
          mkdir -p "$HOME/.gradle/init.d" "$RUNNER_TEMP/catalog"
          cp .github/android-package-catalog.gradle "$HOME/.gradle/init.d/catalog.gradle"
          export LAB_CATALOG_OUTPUT="$RUNNER_TEMP/catalog"
          python3 - "$EXACT" <<'PYCODE'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); p=root/'host/android/app/build.gradle.kts'
          names=['device','motion','geolocation','nfc','speech-synthesis','local-auth','photos','search-index']
          paths=','.join('"'+str(root/'packages'/n/'android')+'"' for n in names)
          p.write_text(p.read_text()+'\nandroid.sourceSets["main"].kotlin.srcDirs('+paths+')\n')
          PYCODE
          set +e
          bash .github/camera-gradle-fixture.sh seed
          status=$?
          set -e
          echo "Exact command exit: $status (failures in individual experimental tasks are expected)"
          ls -lh "$RUNNER_TEMP/catalog"
          test -n "$(find "$RUNNER_TEMP/catalog" -name '*.jar' -print -quit)"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: synthetic-catalog-jars
          path: ${{ runner.temp }}/catalog/*.jar
          if-no-files-found: error
          retention-days: 1
  consume:
    needs: catalog
    runs-on: blacksmith-16vcpu-ubuntu-2604
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: android, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '8'}
      - uses: actions/download-artifact@v8.0.2
        with: {name: synthetic-catalog-jars, path: '${{ runner.temp }}/catalog'}
      - name: Consume only camera and device in a different app
        run: |
          export LAB_JAR_DIR="$RUNNER_TEMP/catalog" LAB_EXTRA_DEVICE=1
          python3 - "$EXACT" <<'PYCODE'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); p=root/'scripts/agent-android.mjs'; s=p.read_text(); old='bound.flatMap((b) => b.dirs)'; new="bound.flatMap((b) => ['camera', 'device'].includes(b.extension) ? [] : b.dirs)"; assert s.count(old)==1; p.write_text(s.replace(old,new))
          p=root/'host/android/app/build.gradle.kts'; s=p.read_text(); p.write_text(s+'\ndependencies { implementation(files(System.getenv("LAB_JAR_DIR") + "/camera.jar", System.getenv("LAB_JAR_DIR") + "/device.jar")) }\n')
          PYCODE
          bash .github/camera-gradle-fixture.sh fresh
          mapping="$CARGO_TARGET_DIR/android/app/outputs/mapping/release/mapping.txt"
          grep -m1 -E '^exact\.camera\.CameraModule -> ' "$mapping"
          grep -m1 -E '^exact\.device\.DeviceModule -> ' "$mapping"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: synthetic-catalog-consumer-apk
          path: ${{ runner.temp }}/fresh-cameranotes.apk
          retention-days: 1
