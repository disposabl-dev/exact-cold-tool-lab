name: Measure Android incremental release link
on:
  push:
    branches: [android-restore-v2]
permissions:
  contents: read
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  NATIVE_CACHE_RELEASE: https://github.com/disposabl-dev/exact-cold-tool-lab/releases/download/compiled-inputs-v2
  EXACT_TOOLS_ORIGIN: none
  EXACT_UPDATE_TRUST: production
  EXACT_UPDATE_GENESIS: '1'
  EXACT_BUILD_NUMBER: '1'
  CARGO_PROFILE_RELEASE_LTO: 'off'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_PROFILE_BALANCED_LTO: 'off'
  CARGO_PROFILE_SIZE_LTO: 'off'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        platform: [android]
    runs-on: ${{ matrix.platform == 'ios' && 'blacksmith-6vcpu-macos-27' || 'blacksmith-8vcpu-ubuntu-2604' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/exact-setup
        with:
          platform: ${{ matrix.platform }}
          exact-ref: ${{ env.EXACT_REF }}
          bundle-version: ${{ matrix.platform == 'ios' && '3' || '4' }}
      - name: Restore compiler dependencies from release
        run: bash .github/actions/exact-setup/scripts/native-cache.sh android
      - name: Build different production fixture
        env:
          CARGO_LOG: cargo::core::compiler::fingerprint=info
        run: |
          cd "$NATIVE_APP_DIR"
          export EXACT_KEYSTORE="$RUNNER_TEMP/unpublished.p12" EXACT_KEY_ALIAS=android EXACT_KEYSTORE_PASSWORD=standalone-test EXACT_KEY_PASSWORD=standalone-test
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$EXACT_KEYSTORE" -storepass:env EXACT_KEYSTORE_PASSWORD -keypass:env EXACT_KEY_PASSWORD -alias android -keyalg RSA -dname CN=Disposable -validity 2
          export CONVEX_ORIGIN=wss://restored-fixture-456.convex.cloud EXACT_BAKE_OUTPUT="$RUNNER_TEMP/bake" EXACT_MOBILE_CHANNEL=base-1
          export EXACT_UPDATE_SEED=$(openssl rand -base64 32)
          sed -i 's/dev.disposabl.exact/dev.disposabl.different/g;s/com.example.apps-8d662a/dev.example.different/g' app.json
          bun "$GITHUB_WORKSPACE/.github/actions/exact-setup/scripts/mobile-updates.mjs" configure android
          unset EXACT_UPDATE_SEED
          bun exact.mjs android --release --no-install --json > "$RUNNER_TEMP/result.json"
