name: Fresh Android runner setup and signed package comparison
on:
  push:
    branches: [measure-native-restore-v9]
permissions:
  contents: read
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
jobs:
  compare:
    runs-on: blacksmith-16vcpu-ubuntu-2604
    strategy:
      fail-fast: false
      matrix:
        mode: [archive, mounted]
        sample: [1, 2]
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@v2.2.0
        with: {bun-version: '1.4.5'}
      - name: Restore ordinary release inputs and prime Gradle
        if: matrix.mode == 'archive'
        uses: ./.github/actions/exact-setup
        with:
          exact-ref: ${{ env.EXACT_REF }}
          platform: android
          bundle-version: '9'
          bun-ready: 'true'
      - name: Restore mounted release inputs and prime Gradle
        if: matrix.mode == 'mounted'
        run: |
          cd "$RUNNER_TEMP"
          release="https://github.com/$GITHUB_REPOSITORY/releases/download/android-mounted-tools-lab-v1"
          curl -fsSL --retry 3 -o index.json "$release/index.json"
          echo '16eb8f2b003aee8ad9dd140ad8c0bf8059ad4b1f192fa374b59bd32f531ca703  index.json' | sha256sum -c -
          python3 "$GITHUB_WORKSPACE/.github/chunked-snapshot.py" fetch android.squashfs index.json --url "$release/android.squashfs"
          cd "$GITHUB_WORKSPACE"
          bash .github/android-snapshot.sh mount
          cp -R "$HOME/work/_temp/exact-sdk/host/android" "$RUNNER_TEMP/gradle-prime"
          metadata="$GITHUB_WORKSPACE/apps/apps/gradle-verification.xml"
          if [[ -f "$metadata" ]]; then cp "$metadata" "$RUNNER_TEMP/gradle-prime/gradle/verification-metadata.xml"; fi
          cd "$RUNNER_TEMP/gradle-prime"
          nohup ./gradlew --offline --daemon --no-watch-fs --dependency-verification=strict help > "$RUNNER_TEMP/gradle-prime.log" 2>&1 < /dev/null &
      - name: Build and verify signed APK
        run: bash .github/camera-gradle-fixture.sh fresh
