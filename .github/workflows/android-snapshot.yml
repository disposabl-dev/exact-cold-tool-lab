name: Android read-only tool image cold benchmark
on:
  push:
    branches: [android-public-snapshot-download]
permissions: {contents: read, actions: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
jobs:
  publish:
    runs-on: blacksmith-8vcpu-ubuntu-2604
    permissions: {contents: write, actions: read}
    outputs:
      index: ${{ steps.publish.outputs.index }}
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v8.0.2
        with: {name: public-android-snapshot, run-id: 45019448518, github-token: '${{ github.token }}', path: '${{ runner.temp }}'}
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          echo "$(cat android.squashfs.sha256)  android.squashfs" | sha256sum -c -
          python3 "$GITHUB_WORKSPACE/.github/chunked-snapshot.py" index android.squashfs index.json
          gh release create android-mounted-tools-lab-v1 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Experimental public Android tool snapshot' --notes 'Tool image built solely from the pinned public v9 Exact release.' android.squashfs index.json
          echo "index=$(sha256sum index.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
  fresh:
    needs: publish
    runs-on: blacksmith-16vcpu-ubuntu-2604
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@v2.2.0
        with: {bun-version: '1.4.5'}
      - name: Download pinned public tool image with per-chunk verification
        env:
          INDEX_DIGEST: ${{ needs.publish.outputs.index }}
        run: |
          cd "$RUNNER_TEMP"
          release="https://github.com/$GITHUB_REPOSITORY/releases/download/android-mounted-tools-lab-v1"
          curl -fsSL --retry 3 -o index.json "$release/index.json"
          echo "$INDEX_DIGEST  index.json" | sha256sum -c -
          time python3 "$GITHUB_WORKSPACE/.github/chunked-snapshot.py" fetch android.squashfs index.json --url "$release/android.squashfs"
      - name: Mount and configure shared tool image
        run: time bash .github/android-snapshot.sh mount
      - name: Build signed APK with distinct identity
        run: bash .github/camera-gradle-fixture.sh fresh
