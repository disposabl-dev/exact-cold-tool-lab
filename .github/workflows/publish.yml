name: Measure public delivery
on:
  push:
    branches: [public-raw-release-transfer-228]
permissions:
  contents: read
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
  EXACT_UPDATE_TRUST: production
  EXACT_UPDATE_GENESIS: 1
  EXACT_MOBILE_CHANNEL: base-1
  CONVEX_ORIGIN: wss://first-install-probe.invalid
  EXACT_BUILD_NUMBER: 1
jobs:
  release:
    runs-on: blacksmith-8vcpu-ubuntu-2604
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: lab
          persist-credentials: false
      - name: Prepare and measure direct release upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lab/.github/direct-release.py
