name: Verify iOS kit fresh runner consumer
on:
  push:
    branches: [ios-verified-arms-consumer]
permissions:
  contents: read
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
  EXACT_UPDATE_TRUST: production
  EXACT_UPDATE_GENESIS: '1'
  EXACT_BUILD_NUMBER: '1'
  CARGO_PROFILE_RELEASE_LTO: 'off'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_PROFILE_BALANCED_LTO: 'off'
  CARGO_PROFILE_SIZE_LTO: 'off'
jobs:
  consumer:
    runs-on: blacksmith-6vcpu-macos-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with:
          platform: ios
          exact-ref: ${{ env.EXACT_REF }}
          bundle-version: '3'
      - name: Build a different public app from the kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ios-verified-consumer.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ios-verified-consumer-evidence
          path: |
            ${{ runner.temp }}/consumer-build.log
            ${{ runner.temp }}/consumer.ipa
            ${{ runner.temp }}/consumer.receipt.json
          retention-days: 1
