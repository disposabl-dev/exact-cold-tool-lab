name: Test iOS filesystem helper reuse
on:
  push:
    branches: [ios-cargo-profile-v7]
permissions:
  contents: read
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
  EXACT_UPDATE_TRUST: production
  EXACT_UPDATE_GENESIS: '1'
  EXACT_BUILD_NUMBER: '1'
  EXACT_VERSION: 0.1.0
  EXACT_MOBILE_CHANNEL: base-1
  CONVEX_ORIGIN: wss://profile-public.invalid
jobs:
  producer:
    env: {IOS_PROFILE_ID: dev.disposabl.helperseed, IOS_PROFILE_NAME: HelperSeed, CONVEX_ORIGIN: 'wss://helperseed.invalid'}
    runs-on: blacksmith-6vcpu-macos-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: ios, exact-ref: '${{ env.EXACT_REF }}', bun-version: '1.4.5', bundle-version: '7'}
      - name: Build public producer
        run: bash .github/ios-cargo-profile.sh
      - name: Capture verified Exact filesystem helper
        run: python3 .github/ios-helper-capture.py "$CARGO_TARGET_DIR" "$EXACT" "$RUNNER_TEMP/helper"
      - uses: actions/upload-artifact@v7.0.2
        with: {name: ios-filesystem-helper, path: '${{ runner.temp }}/helper/', retention-days: 1}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ios-helper-producer-evidence
          path: |
            ${{ runner.temp }}/ios-profile.log
            ${{ runner.temp }}/ios-profile-build.log
          retention-days: 1
  consumer:
    needs: producer
    env: {IOS_PROFILE_ID: dev.disposabl.helperconsumer, IOS_PROFILE_NAME: HelperConsumer, CONVEX_ORIGIN: 'wss://helperconsumer.invalid'}
    runs-on: blacksmith-6vcpu-macos-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: ios, exact-ref: '${{ env.EXACT_REF }}', bun-version: '1.4.5', bundle-version: '7'}
      - uses: actions/download-artifact@v8
        with: {name: ios-filesystem-helper, path: '${{ runner.temp }}/helper'}
      - name: Restore verified Exact filesystem helper
        run: python3 .github/ios-helper-restore.py "$CARGO_TARGET_DIR" "$EXACT" "$RUNNER_TEMP/helper"
      - name: Build different public consumer
        run: bash .github/ios-cargo-profile.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ios-helper-consumer-evidence
          path: |
            ${{ runner.temp }}/ios-profile.log
            ${{ runner.temp }}/ios-profile-build.log
            ${{ runner.temp }}/ios-profile.ipa
            ${{ runner.temp }}/ios-profile.receipt.json
          retention-days: 1
