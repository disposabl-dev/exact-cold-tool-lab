name: Verify canonical iPhone catalog publisher
on:
  push:
    branches: [ios-catalog-canonical-source]
permissions: {contents: read}
env:
  EXACT_REF: a55c5581c7e1a62cdee1f09367ea2909c74c7292
  EXACT_TOOLS_ORIGIN: none
  EXACT_UPDATE_TRUST: production
jobs:
  ios:
    runs-on: blacksmith-12vcpu-macos-27
    steps:
      - uses: actions/checkout@v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/exact-setup
        with: {platform: ios, exact-ref: '${{ env.EXACT_REF }}', bundle-version: '8'}
      - name: Compile and check the canonical package catalog
        run: |
          cd "$NATIVE_APP_DIR"
          bun -e 'const p="app.json", a=await Bun.file(p).json(); a.id=a.app.id="dev.disposabl.publicseed";a.deploy.signing={key:"mobile",keys:{mobile:"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}};await Bun.write(p,JSON.stringify(a))'
          bun "$GITHUB_WORKSPACE/.github/ios-package-cache.mjs"
          count=$(find "$CARGO_TARGET_DIR/apple-swift/ios-17.0-balanced/packages-kept" -name 'ExactPkg_*.dylib' | wc -l)
          [[ "$count" -eq 48 ]]
